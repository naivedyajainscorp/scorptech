<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapphire Assessment Report — Asset Management Maturity</title>
    <link rel="icon" type="image/png" href="assets/images/scorp-sapphire-cropped.png">

    <!-- SCORP Design System -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Report-specific CSS (components + PDF layout) -->
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/assessment-report-pdf.css">

    <!-- ══════════════════════════════════════════════════
         REPORT ENHANCEMENTS
         1. Web-view animations (score counters, bars, SVG)
         2. Print / PDF improvements (page breaks, orphans)
         All values use existing SCORP design-system tokens.
         ══════════════════════════════════════════════════ -->
    <style id="ar-enhancements">

        /* ── WEB VIEW — page card entrance ─────────────── */
        .a4-page {
            transition: box-shadow 0.3s ease;
        }
        @media screen {
            .a4-page {
                animation: ar-page-rise 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
            }
            .a4-page:nth-child(1)  { animation-delay: 0.05s; }
            .a4-page:nth-child(2)  { animation-delay: 0.12s; }
            .a4-page:nth-child(3)  { animation-delay: 0.19s; }
            .a4-page:nth-child(n+4) { animation-delay: 0.26s; }
        }
        @keyframes ar-page-rise {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── WEB VIEW — score circle initial state for JS anim ── */
        .score-fill {
            transition: stroke-dashoffset 1.3s cubic-bezier(0.4, 0, 0.2, 1) 0.4s;
        }
        /* JS will set initial offset to 534 then release to target */

        /* ── WEB VIEW — progress bars start collapsed ───────── */
        .ar-bars-ready .progress-fill {
            width: 0% !important;
            transition: width 0s !important;
        }
        .ar-bars-animate .progress-fill {
            /* width transitions applied inline by JS */
        }

        /* ── WEB VIEW — animated number counter ────────────── */
        .score-number {
            display: inline-block;
            transition: none;
        }
        .score-number.ar-counting {
            animation: ar-number-pulse 0.06s ease infinite;
        }
        @keyframes ar-number-pulse {
            0%  { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* ── WEB VIEW — action plan rank numbers ────────────── */
        .action-rank {
            font-family: 'Science Gothic', sans-serif;
            font-style: italic;
            font-size: 15pt;
        }

        /* ── WEB VIEW — section card hover ──────────────────── */
        @media screen {
            .section-card {
                transition: box-shadow 0.2s ease, transform 0.2s ease;
            }
            .section-card:hover {
                box-shadow: var(--s-shadow-md);
                transform: translateX(3px);
            }
            .insight-item {
                transition: box-shadow 0.2s ease;
            }
            .insight-item:hover {
                box-shadow: none;
            }
        }

        /* ── WEB VIEW — print button (sticky top-right) ─────── */
        .ar-print-btn {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            background: var(--s-gradient-primary);
            color: var(--s-white);
            border: none;
            border-radius: var(--s-radius-full);
            font-family: 'Science Gothic', sans-serif;
            font-weight: var(--s-font-bold);
            font-size: 0.82rem;
            font-style: italic;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.32);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
        }
        .ar-print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 204, 0.44);
            color: var(--s-white);
        }
        .ar-print-btn i {
            font-size: 0.85rem;
        }
        @media (max-width: 576px) {
            .ar-print-btn { display: none; }
        }


        /* ══════════════════════════════════════════════════
           PRINT / PDF IMPROVEMENTS
           Fixes cut paragraphs, page overflow, font sizes.
           ══════════════════════════════════════════════════ */
        @media print {

            /* ── Body & wrapper ── */
            body {
                background: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .report-wrapper {
                max-width: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            /* ── Page container — A4 exact ── */
            .a4-page {
                width:  210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
                overflow: hidden !important;
                display: flex !important;
                flex-direction: column !important;
                animation: none !important;
            }
            .a4-page:last-child {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }

            /* ── Page content — no clipping ── */
            .page-content {
                overflow: hidden !important;
                flex: 1 !important;
            }

            /* ── Block-level avoid-break rules ── */
            .section-card,
            .action-card,
            .insight-item,
            .insight-response,
            .insight-primary,
            .insight-secondary,
            .bonus-card,
            .bonus-solution,
            .toc-item,
            .score-summary,
            .closing-contact-item {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Headings must stay with following content */
            .section-title,
            h1, h2, h3, h4, h5, h6 {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }

            /* List items and paragraphs */
            li {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            p {
                orphans: 3 !important;
                widows:  3 !important;
            }

            /* ── Print-safe font sizes ────────────────────── */
            /* The existing CSS has some sizes at 12pt which is body text
               size in a normal document but is very large for dense report
               content. Tighten to industry-standard report body sizes. */
            .insight-primary p,
            .insight-secondary p {
                font-size: 8.5pt !important;
                line-height: 1.6 !important;
            }
            .action-why,
            .action-impact {
                font-size: 8.5pt !important;
            }
            .action-steps li,
            .bonus-list li,
            .bonus-solution p,
            .section-intro,
            .score-interpretation p {
                font-size: 8.5pt !important;
            }

            /* ── Suppress hover / screen-only effects ── */
            .section-card:hover,
            .insight-item:hover {
                transform: none !important;
                box-shadow: none !important;
            }

            /* ── Hide screen-only UI ── */
            .s-floating-button,
            .ar-redirect-modal,
            .ar-print-btn,
            .ar-loading-screen {
                display: none !important;
            }

        } /* end @media print */

    </style>
</head>
<body>

    <!-- Sticky print button (screen only) -->
    <button class="ar-print-btn" id="ar-sticky-print" aria-label="Download PDF">
        <i class="fas fa-file-arrow-down"></i> Download PDF
    </button>

    <div class="report-wrapper">
        <div id="report-container">
            <div class="a4-page">
                <div class="page-content" style="display:flex;align-items:center;justify-content:center;">
                    <div class="report-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <h2>Generating Your Report</h2>
                        <p>Analysing your assessment responses...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- ── FLOATING ACTION BUTTON ── -->
    <div class="s-floating-button">
        <div class="s-fab-backdrop"></div>
        <button class="s-fab-trigger" aria-label="Report Actions">
            <i class="fas fa-compass"></i>
        </button>
        <div class="s-fab-menu">
            <div class="s-fab-menu-header">
                <h6 class="s-fab-menu-title">Report Actions</h6>
            </div>
            <div class="s-fab-menu-body">
                <button class="s-fab-menu-item" id="ar-download-pdf">
                    <div class="s-fab-menu-item-icon"><i class="fas fa-file-arrow-down"></i></div>
                    <span class="s-fab-menu-item-text">Download Report</span>
                </button>
                <button class="s-fab-menu-item" id="ar-email">
                    <div class="s-fab-menu-item-icon"><i class="fas fa-envelope"></i></div>
                    <span class="s-fab-menu-item-text">Email Report</span>
                </button>
                <a class="s-fab-menu-item" href="assessment.html">
                    <div class="s-fab-menu-item-icon"><i class="fas fa-redo"></i></div>
                    <span class="s-fab-menu-item-text">Retake Assessment</span>
                </a>
            </div>
            <div class="s-fab-menu-footer">
                <a href="book-demo.html" class="s-fab-cta-btn s-fab-cta-primary">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Book Demo</span>
                </a>
                <a href="contact.html" class="s-fab-cta-btn s-fab-cta-secondary">
                    <i class="fas fa-envelope"></i>
                    <span>Contact</span>
                </a>
            </div>
        </div>
    </div>


    <!-- ── REDIRECT MODAL ── -->
    <div class="ar-redirect-modal" id="ar-redirect-modal">
        <div class="ar-modal-overlay" id="ar-modal-overlay"></div>
        <div class="ar-modal-content">
            <div class="ar-modal-icon">
                <i class="fas fa-file-arrow-down"></i>
            </div>
            <h3>Report Downloaded!</h3>
            <p id="ar-modal-message">Redirecting you in...</p>
            <div class="ar-modal-countdown" id="ar-modal-countdown">5</div>
            <div class="ar-modal-progress-bar">
                <div class="ar-modal-progress-fill" id="ar-modal-progress-fill"></div>
            </div>
            <button class="ar-modal-skip" id="ar-modal-skip">Skip — go now</button>
        </div>
    </div>


    <!-- ── SCRIPTS ── -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/data/assessment-data.js"></script>
    <script src="assets/data/assessment-responses.js"></script>
    <script type="module" src="js/pages/assessment-report.js"></script>
    <script type="module" src="js/main.js"></script>


    <!-- ════════════════════════════════════════════════
         REPORT ANIMATION LAYER
         Runs after assessment-report.js renders the pages.
         Waits for the report DOM via MutationObserver,
         then orchestrates:
           - Score number count-up animation
           - Progress bar animated fill
           - SVG score circle stroke animation
           - Sticky print button wired to window.print()
         ════════════════════════════════════════════════ -->
    <script>
    (function () {
        'use strict';

        /* ── Wire the sticky print button ── */
        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('ar-sticky-print');
            if (btn) {
                btn.addEventListener('click', function () {
                    window.print();
                });
            }
        });


        /* ── Wait for report to render (module scripts run async) ── */
        function _waitForReport(cb) {
            var container = document.getElementById('report-container');
            if (!container) {
                setTimeout(function () { _waitForReport(cb); }, 80);
                return;
            }

            /* Check if already rendered (score number present) */
            if (container.querySelector('.score-number')) {
                setTimeout(cb, 120);
                return;
            }

            var obs = new MutationObserver(function () {
                if (container.querySelector('.score-number')) {
                    obs.disconnect();
                    setTimeout(cb, 150);
                }
            });
            obs.observe(container, { childList: true, subtree: true });
        }


        /* ── Orchestrate all report animations ── */
        function _animateReport() {

            /* 1. Animated score number count-up */
            document.querySelectorAll('.score-number').forEach(function (el) {
                var target = parseInt(el.textContent, 10);
                if (isNaN(target) || target === 0) return;
                el.textContent = '0';
                var startTime = null;
                var DURATION  = 1350;

                function _frame(ts) {
                    if (!startTime) startTime = ts;
                    var elapsed  = ts - startTime;
                    var progress = Math.min(elapsed / DURATION, 1);
                    /* Ease-out cubic */
                    var eased    = 1 - Math.pow(1 - progress, 3);
                    el.textContent = Math.round(target * eased);
                    if (progress < 1) {
                        requestAnimationFrame(_frame);
                    } else {
                        el.textContent = target;
                    }
                }
                requestAnimationFrame(_frame);
            });


            /* 2. SVG score circle — reset to 534, then animate to target */
            document.querySelectorAll('.score-fill').forEach(function (circle) {
                var targetOffset = parseFloat(circle.style.strokeDashoffset) || 0;
                /* Suppress CSS transition, jump to 534 (empty circle) */
                circle.style.transition = 'none';
                circle.style.strokeDashoffset = '534';

                /* Force reflow, then release to target with transition */
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        circle.style.transition = 'stroke-dashoffset 1.3s cubic-bezier(0.4, 0, 0.2, 1) 0.35s';
                        circle.style.strokeDashoffset = targetOffset;
                    });
                });
            });


            /* 3. Progress bar animated fill — collect targets, reset, release */
            var bars = document.querySelectorAll('.progress-fill');
            /* Snapshot target widths before zeroing */
            var targets = [];
            bars.forEach(function (bar) {
                targets.push(bar.style.width || '0%');
            });

            bars.forEach(function (bar) {
                bar.style.transition = 'none';
                bar.style.width = '0%';
            });

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    bars.forEach(function (bar, i) {
                        var delay = 0.25 + i * 0.08;
                        bar.style.transition = 'width 1s cubic-bezier(0.4, 0, 0.2, 1) ' + delay + 's';
                        bar.style.width = targets[i];
                    });
                });
            });
        }


        /* ── Boot ── */
        _waitForReport(_animateReport);

    })();
    </script>

</body>
</html>
