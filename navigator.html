<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #1e1e1e;
  --sidebar-bg:  #252526;
  --tab-bg:      #2d2d2d;
  --tab-active:  #1e1e1e;
  --border:      #3c3c3c;
  --border-soft: #2a2a2a;
  --text:        #cccccc;
  --text-dim:    #858585;
  --text-muted:  #5a5a5a;
  --accent:      #0e7bdb;
  --accent-soft: #1a8af0;
  --folder:      #dcb67a;
  --hover-bg:    #2a2d2e;
  --active-bg:   #094771;
  --active-tree: #37373d;
  --gutter-bg:   #1e1e1e;
  --gutter-fg:   #858585;
  --minimap-bg:  #1e1e1e;
  --scrollbar:   #424242;
  --header-bg:   #252526;
  --crumb-sep:   #4e4e4e;
  --tag-bg:      #3a3a3a;
  --font:        'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono:        'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
}

html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* ── SCROLLBARS ── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
::-webkit-scrollbar-corner { background: transparent; }

/* ══════════════════════════════════════════════
   HIGHLIGHT.JS — VS CODE DARK+ COLORS
══════════════════════════════════════════════ */
.hljs                       { background: var(--bg) !important; color: #d4d4d4; }
.hljs-keyword,
.hljs-built_in,
.hljs-literal,
.hljs-tag                   { color: #569cd6; }
.hljs-type,
.hljs-title.class_          { color: #4ec9b0; }
.hljs-number                { color: #b5cea8; }
.hljs-string,
.hljs-char                  { color: #ce9178; }
.hljs-comment,
.hljs-doctag                { color: #6a9955; font-style: italic; }
.hljs-function,
.hljs-title,
.hljs-title.function_       { color: #dcdcaa; }
.hljs-attr,
.hljs-attribute,
.hljs-variable,
.hljs-property,
.hljs-params,
.hljs-name                  { color: #9cdcfe; }
.hljs-meta                  { color: #9cdcfe; }
.hljs-regexp                { color: #d16969; }
.hljs-selector-tag,
.hljs-selector-id,
.hljs-selector-class,
.hljs-selector-pseudo       { color: #d7ba7d; }
.hljs-addition              { color: #6a9955; }
.hljs-deletion              { color: #d16969; }
.hljs-section               { color: #dcdcaa; }
.hljs-template-variable     { color: #9cdcfe; }
.hljs-operator,
.hljs-punctuation           { color: #d4d4d4; }
.hljs-subst                 { color: #d4d4d4; }
.hljs-symbol                { color: #d4d4d4; }

/* ══════════════════════════════════════════════
   TOP BAR
══════════════════════════════════════════════ */
#topbar {
  height: 36px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  flex-shrink: 0;
  user-select: none;
  z-index: 100;
}
.logo { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
.topbar-sep { color: var(--border); font-size: 18px; font-weight: 100; }
#project-name { font-size: 12px; color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 3px; font-size: 11px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--border); background: transparent;
  color: var(--text-dim); transition: background .12s, color .12s, border-color .12s;
  white-space: nowrap; text-decoration: none; font-family: var(--font);
}
.tb-btn:hover { background: var(--hover-bg); color: var(--text); border-color: #5a5a5a; }
.tb-btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.tb-btn.accent:hover { background: var(--accent-soft); }
#refresh-status { display:none; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); }
.dot-live { width: 6px; height: 6px; border-radius: 50%; background: #4ec9b0; box-shadow: 0 0 5px #4ec9b0; animation: blink 2.5s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

/* ══════════════════════════════════════════════
   TAB BAR
══════════════════════════════════════════════ */
#tab-bar {
  height: 35px;
  background: var(--tab-bg);
  border-bottom: 1px solid var(--border);
  display: none;
  align-items: flex-end;
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
}
#tab-bar::-webkit-scrollbar { height: 3px; }
#tab-bar::-webkit-scrollbar-thumb { background: var(--scrollbar); }

.tab {
  display: inline-flex; align-items: center; gap: 6px;
  height: 35px; padding: 0 10px 0 12px;
  border-right: 1px solid var(--border);
  background: var(--tab-bg);
  color: var(--text-dim);
  font-size: 12px; cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background .1s, color .1s;
  position: relative;
}
.tab:hover { background: #2e2e2e; color: var(--text); }
.tab.active {
  background: var(--tab-active);
  color: var(--text);
  border-bottom: 1px solid var(--tab-active);
}
.tab.active::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: var(--accent);
}
.tab-icon { font-size: 11px; }
.tab-name { max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
.tab-close {
  width: 16px; height: 16px; border-radius: 3px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; line-height: 1; color: var(--text-muted);
  transition: background .1s, color .1s;
  flex-shrink: 0;
}
.tab-close:hover { background: #5a5a5a; color: var(--text); }

/* ══════════════════════════════════════════════
   MAIN LAYOUT
══════════════════════════════════════════════ */
#main { display: flex; flex: 1; overflow: hidden; }

/* ══════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════ */
#sidebar {
  width: 260px; min-width: 150px; max-width: 65%;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden; flex-shrink: 0;
}
#sidebar-header {
  height: 35px; padding: 0 14px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
#sidebar-header span { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
#file-count { font-size: 10px; color: var(--text-muted); }
#search-wrap { padding: 6px 8px; border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
#search {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 3px; color: var(--text); font-size: 12px;
  padding: 4px 9px; outline: none; font-family: var(--font);
}
#search::placeholder { color: var(--text-muted); }
#search:focus { border-color: var(--accent); }
#tree { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 0; }
#tree-empty { padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 12px; line-height: 1.8; }
#tree-empty strong { color: var(--accent); }

/* ── TREE NODES ── */
.tree-row {
  display: flex; align-items: center; gap: 5px;
  padding: 2px 10px 2px 8px;
  font-size: 13px; cursor: pointer;
  white-space: nowrap; overflow: hidden;
  color: var(--text); border-radius: 3px;
  margin: 0 2px;
  transition: background .08s;
  user-select: none;
}
.tree-row:hover { background: var(--hover-bg); }
.tree-row.active { background: var(--active-tree); }
.tree-arrow { font-size: 8px; color: var(--text-muted); width: 12px; flex-shrink: 0; transition: transform .15s; }
.tree-folder-row .tree-arrow.open { transform: rotate(90deg); }
.tree-folder-name { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree-file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.fext { font-size: 9px; padding: 1px 4px; border-radius: 2px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; }
.tree-children { display: none; padding-left: 12px; border-left: 1px solid #333; margin-left: 13px; }
.tree-children.open { display: block; }

/* ── DIVIDER ── */
#divider {
  width: 3px; background: var(--border); cursor: col-resize;
  flex-shrink: 0; z-index: 10; transition: background .15s;
}
#divider:hover, #divider.drag { background: var(--accent); }

/* ══════════════════════════════════════════════
   EDITOR AREA
══════════════════════════════════════════════ */
#editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── BREADCRUMB ── */
#breadcrumb {
  height: 28px; background: var(--header-bg);
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center;
  padding: 0 14px; gap: 0;
  font-size: 11.5px; overflow: hidden;
  flex-shrink: 0;
}
.crumb {
  color: var(--text-dim); cursor: pointer;
  padding: 2px 4px; border-radius: 2px;
  white-space: nowrap;
  transition: color .1s, background .1s;
}
.crumb:hover { color: var(--text); background: var(--hover-bg); }
.crumb.last { color: var(--text); font-weight: 500; cursor: default; }
.crumb.last:hover { background: transparent; }
.crumb-sep { color: var(--crumb-sep); padding: 0 2px; font-size: 11px; user-select: none; }

/* ── PANEL HEADER ── */
#panel-header {
  height: 32px; background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 12px; gap: 12px;
  flex-shrink: 0;
}
#file-meta { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
.meta-item { font-size: 11px; color: var(--text-dim); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.meta-label { color: var(--text-muted); }
#copy-btn { display: none; }
#open-tab-btn { display: none; }
#copy-success {
  font-size: 11px; color: #4ec9b0;
  opacity: 0; transition: opacity .3s;
  white-space: nowrap;
}

/* ── EDITOR CONTENT ── */
#editor-content { flex: 1; display: flex; overflow: hidden; }

/* ── LINE GUTTER ── */
#line-gutter {
  background: var(--gutter-bg);
  color: var(--gutter-fg);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  text-align: right;
  padding: 18px 12px 18px 16px;
  min-width: 52px;
  width: 52px;
  overflow: hidden;
  flex-shrink: 0;
  white-space: pre;
  border-right: 1px solid var(--border-soft);
  user-select: none;
  pointer-events: none;
}

/* ── CODE SCROLL ── */
#code-scroll { flex: 1; overflow: auto; background: var(--bg); }
#code-scroll pre { margin: 0; }
#code-scroll code {
  font-family: var(--mono) !important;
  font-size: 13px !important;
  line-height: 1.6 !important;
  display: block;
  padding: 18px 20px !important;
  tab-size: 2;
}

/* ── MINIMAP ── */
#minimap {
  width: 110px; min-width: 110px;
  background: var(--minimap-bg);
  border-left: 1px solid var(--border-soft);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  cursor: pointer;
}
.minimap-inner {
  position: absolute;
  top: 0; left: 0; right: 0;
  pointer-events: none;
  will-change: transform;
}
.minimap-code {
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  white-space: pre;
  display: block;
  transform-origin: top left;
  pointer-events: none;
  padding: 18px 20px;
  color: transparent !important;
  text-shadow: none !important;
}
.minimap-code .hljs-keyword  { color: #569cd650 !important; }
.minimap-code .hljs-string   { color: #ce917850 !important; }
.minimap-code .hljs-comment  { color: #6a995550 !important; }
.minimap-code .hljs-function,
.minimap-code .hljs-title    { color: #dcdcaa50 !important; }
.minimap-code .hljs-attr,
.minimap-code .hljs-property { color: #9cdcfe50 !important; }
.minimap-code .hljs-number   { color: #b5cea850 !important; }
.minimap-code .hljs-type     { color: #4ec9b050 !important; }
.minimap-code span           { text-shadow: none !important; }
.minimap-viewport {
  position: absolute;
  left: 0; right: 0;
  background: rgba(255,255,255,0.07);
  border-top: 1px solid rgba(255,255,255,0.15);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  pointer-events: none;
  transition: top .05s;
}

/* ── EMPTY STATE ── */
#empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 14px;
  color: var(--text-muted); text-align: center; padding: 40px;
}
.es-icon { font-size: 44px; opacity: 0.3; }
.es-title { font-size: 16px; color: var(--text-dim); font-weight: 400; }
.es-sub { font-size: 12px; line-height: 1.7; max-width: 280px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">⬡ NAVYgator</span>
  <span class="topbar-sep">|</span>
  <span id="project-name">No project open</span>
  <button class="tb-btn accent" id="open-folder-btn">📂 Open Folder</button>
  <button class="tb-btn" id="collapse-btn">⊟ Collapse All</button>
  <div id="refresh-status"><span class="dot-live"></span><span>Live</span></div>
</div>

<!-- TAB BAR -->
<div id="tab-bar"></div>

<!-- MAIN -->
<div id="main">
  <div id="sidebar">
    <div id="sidebar-header">
      <span>Explorer</span>
      <span id="file-count">—</span>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search files… (Ctrl+P)" autocomplete="off">
    </div>
    <div id="tree">
      <div id="tree-empty">Click <strong>Open Folder</strong><br>to load your project</div>
    </div>
  </div>

  <div id="divider"></div>

  <div id="editor-area">
    <div id="breadcrumb"></div>
    <div id="panel-header">
      <div id="file-meta">
        <span class="meta-item" id="meta-lines"><span class="meta-label">Lines</span><span id="val-lines">—</span></span>
        <span class="meta-item" id="meta-size"><span class="meta-label">Size</span><span id="val-size">—</span></span>
        <span class="meta-item" id="meta-modified"><span class="meta-label">Modified</span><span id="val-modified">—</span></span>
      </div>
      <span id="copy-success">✓ Copied!</span>
      <button class="tb-btn" id="copy-btn">⎘ Copy Source</button>
      <a class="tb-btn" id="open-tab-btn" target="_blank">↗ Open</a>
    </div>
    <div id="editor-content">
      <div id="line-gutter"></div>
      <div id="code-scroll">
        <div id="empty-state">
          <div class="es-icon">🗂</div>
          <div class="es-title">Select a file</div>
          <div class="es-sub">Open your project folder and click any file in the sidebar to view its source.</div>
        </div>
      </div>
      <div id="minimap"><div class="minimap-inner"><pre><code class="minimap-code"></code></pre></div><div class="minimap-viewport"></div></div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════
const LOCALHOST   = 'http://127.0.0.1:5500';
const REFRESH_MS  = 4000;
const IGNORE      = new Set(['.git','node_modules','.vscode','__pycache__','dist','.DS_Store','Thumbs.db','.idea','out','build']);
const IMG_EXTS    = new Set(['png','jpg','jpeg','webp','svg','ico','gif','bmp','avif']);
const FONT_EXTS   = new Set(['ttf','woff','woff2','eot','otf']);
const BIN_EXTS    = new Set(['pdf','zip','mp4','mp3','mov','exe','dll','wasm']);
const LANG_MAP    = {html:'html',htm:'html',css:'css',js:'javascript',mjs:'javascript',
                     ts:'typescript',json:'json',md:'markdown',xml:'xml',php:'php',
                     py:'python',svg:'xml',txt:'plaintext',sh:'bash',scss:'scss',
                     less:'less',yaml:'yaml',yml:'yaml',toml:'ini',vue:'xml',
                     jsx:'javascript',tsx:'typescript'};

// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
let rootHandle    = null;
let refreshTimer  = null;
let openFolders   = new Set();  // paths of expanded folders
let allFiles      = [];         // [{path, handle}]
let searchQ       = '';
let activeTabId   = null;
let tabs          = [];         // [{id, path, handle, ext, icon, cache}]
let tabIdSeq      = 0;
let rawSourceCache = {};        // path -> raw text

// ════════════════════════════════════════════════════════
// EXT META
// ════════════════════════════════════════════════════════
const EXT_META = {
  html: {icon:'🌐', color:'#e34c26', bg:'#3a1a0e'},
  htm:  {icon:'🌐', color:'#e34c26', bg:'#3a1a0e'},
  css:  {icon:'🎨', color:'#264de4', bg:'#0e1530'},
  scss: {icon:'🎨', color:'#cc6699', bg:'#2d1520'},
  less: {icon:'🎨', color:'#1d365d', bg:'#0e1830'},
  js:   {icon:'📜', color:'#f7df1e', bg:'#2d2a00'},
  mjs:  {icon:'📜', color:'#f7df1e', bg:'#2d2a00'},
  ts:   {icon:'📘', color:'#3178c6', bg:'#0e1d30'},
  json: {icon:'📋', color:'#40bf77', bg:'#0a2016'},
  md:   {icon:'📝', color:'#858585', bg:'#222'},
  txt:  {icon:'📄', color:'#858585', bg:'#222'},
  svg:  {icon:'🖼', color:'#ffb13b', bg:'#2d1f00'},
  png:  {icon:'🖼', color:'#858585', bg:'#222'},
  jpg:  {icon:'🖼', color:'#858585', bg:'#222'},
  jpeg: {icon:'🖼', color:'#858585', bg:'#222'},
  webp: {icon:'🖼', color:'#858585', bg:'#222'},
  ico:  {icon:'🔷', color:'#858585', bg:'#222'},
  gif:  {icon:'🖼', color:'#858585', bg:'#222'},
  php:  {icon:'🐘', color:'#7b7fb5', bg:'#1a1a2d'},
  py:   {icon:'🐍', color:'#3572a5', bg:'#0e1830'},
  ttf:  {icon:'🔤', color:'#a371f7', bg:'#1e1030'},
  woff: {icon:'🔤', color:'#a371f7', bg:'#1e1030'},
  woff2:{icon:'🔤', color:'#a371f7', bg:'#1e1030'},
  xml:  {icon:'📋', color:'#ff9800', bg:'#2d1600'},
  vue:  {icon:'💚', color:'#42b883', bg:'#0a2016'},
  jsx:  {icon:'⚛', color:'#61dafb', bg:'#002030'},
  tsx:  {icon:'⚛', color:'#61dafb', bg:'#002030'},
  sh:   {icon:'⚡', color:'#89e051', bg:'#0a1a00'},
  yaml: {icon:'⚙', color:'#cc1018', bg:'#2d0508'},
  yml:  {icon:'⚙', color:'#cc1018', bg:'#2d0508'},
};
const DEF_META = {icon:'📄', color:'#858585', bg:'#222'};
const getExt  = n => (n.split('.').pop() || '').toLowerCase();
const getMeta = n => EXT_META[getExt(n)] || DEF_META;

// ════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}
function formatDate(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ════════════════════════════════════════════════════════
// OPEN FOLDER
// ════════════════════════════════════════════════════════
document.getElementById('open-folder-btn').addEventListener('click', async () => {
  try {
    const h = await window.showDirectoryPicker({ mode:'read' });
    rootHandle = h;
    document.getElementById('project-name').textContent = h.name;
    document.getElementById('refresh-status').style.display = 'flex';
    openFolders.clear();
    await rebuildTree();
    startRefresh();
  } catch(e) { if (e.name !== 'AbortError') console.error(e); }
});

// ════════════════════════════════════════════════════════
// BUILD TREE
// ════════════════════════════════════════════════════════
async function rebuildTree() {
  if (!rootHandle) return;
  allFiles = [];
  const wrap = document.getElementById('tree');
  const frag = document.createDocumentFragment();
  await renderDir(rootHandle, frag, '');
  wrap.innerHTML = '';
  wrap.appendChild(frag);
  applySearch(searchQ);
  document.getElementById('file-count').textContent = allFiles.length + ' files';
}

async function renderDir(dirHandle, container, path) {
  const entries = [];
  for await (const e of dirHandle.values()) {
    if (!IGNORE.has(e.name)) entries.push(e);
  }
  entries.sort((a,b) => {
    if (a.kind === b.kind) return a.name.localeCompare(b.name);
    return a.kind === 'directory' ? -1 : 1;
  });
  for (const entry of entries) {
    const ePath = path ? path+'/'+entry.name : entry.name;
    if (entry.kind === 'directory') {
      const isOpen = openFolders.has(ePath);
      const row = document.createElement('div');
      row.className = 'tree-row tree-folder-row';
      row.dataset.path = ePath;
      row.innerHTML = `<span class="tree-arrow ${isOpen?'open':''}">▶</span><span style="font-size:13px">${isOpen?'📂':'📁'}</span><span class="tree-folder-name">${entry.name}</span>`;
      row.addEventListener('click', () => {
        const open = openFolders.has(ePath);
        const arrow = row.querySelector('.tree-arrow');
        const children = row.nextElementSibling;
        if (open) {
          openFolders.delete(ePath);
          arrow.classList.remove('open');
          row.querySelector('span:nth-child(2)').textContent = '📁';
          if (children) children.classList.remove('open');
        } else {
          openFolders.add(ePath);
          arrow.classList.add('open');
          row.querySelector('span:nth-child(2)').textContent = '📂';
          if (children) children.classList.add('open');
        }
      });
      container.appendChild(row);
      const children = document.createElement('div');
      children.className = 'tree-children' + (isOpen?' open':'');
      container.appendChild(children);
      await renderDir(entry, children, ePath);
    } else {
      const ext  = getExt(entry.name);
      const meta = getMeta(entry.name);
      const row  = document.createElement('div');
      const isActive = tabs.find(t=>t.path===ePath && t.id===activeTabId);
      row.className = 'tree-row tree-file-row' + (isActive?' active':'');
      row.dataset.path = ePath;
      row.innerHTML = `<span style="width:12px;flex-shrink:0"></span><span class="tab-icon" style="font-size:12px">${meta.icon}</span><span class="tree-file-name">${entry.name}</span><span class="fext" style="color:${meta.color};background:${meta.bg}">${ext}</span>`;
      row.addEventListener('click', () => openFile(entry, ePath));
      container.appendChild(row);
      allFiles.push({path:ePath, handle:entry});
    }
  }
}

// ════════════════════════════════════════════════════════
// OPEN FILE → TABS
// ════════════════════════════════════════════════════════
async function openFile(handle, filePath) {
  // If already open in a tab, activate it
  const existing = tabs.find(t => t.path === filePath);
  if (existing) { activateTab(existing.id); return; }

  const ext    = getExt(handle.name);
  const meta   = getMeta(handle.name);
  const isImg  = IMG_EXTS.has(ext);
  const isFont = FONT_EXTS.has(ext);
  const isBin  = BIN_EXTS.has(ext);
  const id     = ++tabIdSeq;

  tabs.push({id, path:filePath, handle, ext, icon:meta.icon, isImg, isFont, isBin, cache:null});
  renderTabBar();
  activateTab(id);
}

function activateTab(id) {
  activeTabId = id;
  renderTabBar();
  const tab = tabs.find(t=>t.id===id);
  if (!tab) return;
  updateTreeHighlight(tab.path);
  renderBreadcrumb(tab.path);
  loadAndRenderFile(tab);
}

function closeTab(id, e) {
  e && e.stopPropagation();
  const idx = tabs.findIndex(t=>t.id===id);
  if (idx === -1) return;
  tabs.splice(idx,1);
  if (activeTabId === id) {
    const next = tabs[Math.min(idx, tabs.length-1)];
    if (next) activateTab(next.id);
    else {
      activeTabId = null;
      showEmptyState();
      renderBreadcrumb('');
      clearPanelMeta();
    }
  }
  renderTabBar();
}

function renderTabBar() {
  const bar = document.getElementById('tab-bar');
  if (tabs.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = '';
  tabs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id===activeTabId?' active':'');
    el.dataset.id = t.id;
    const name = t.path.split('/').pop();
    el.innerHTML = `<span class="tab-icon">${t.icon}</span><span class="tab-name" title="${t.path}">${name}</span><span class="tab-close" title="Close">×</span>`;
    el.addEventListener('click', () => activateTab(t.id));
    el.querySelector('.tab-close').addEventListener('click', ev => closeTab(t.id, ev));
    bar.appendChild(el);
  });
  // Scroll active tab into view
  const activeEl = bar.querySelector('.tab.active');
  if (activeEl) activeEl.scrollIntoView({block:'nearest',inline:'nearest'});
}

// ════════════════════════════════════════════════════════
// LOAD & RENDER FILE
// ════════════════════════════════════════════════════════
async function loadAndRenderFile(tab) {
  // Use cache if available
  if (tab.cache) { applyCache(tab); return; }

  const codeScroll = document.getElementById('code-scroll');
  const gutter     = document.getElementById('line-gutter');

  try {
    const file = await tab.handle.getFile();
    updatePanelMeta(file, null, null);
    const openBtn = document.getElementById('open-tab-btn');
    const copyBtn = document.getElementById('copy-btn');

    if (['html','htm'].includes(tab.ext)) {
      openBtn.style.display = 'inline-flex';
      openBtn.href = LOCALHOST + '/' + tab.path;
    } else { openBtn.style.display = 'none'; }

    if (tab.isImg) {
      copyBtn.style.display = 'none';
      gutter.textContent = '';
      const url = URL.createObjectURL(file);
      codeScroll.innerHTML = `<div style="padding:24px;display:flex;align-items:flex-start;justify-content:center;min-height:100%;background:var(--bg)"><img src="${url}" style="max-width:100%;max-height:calc(100vh - 160px);border-radius:4px;border:1px solid var(--border)"></div>`;
      clearMinimap();
      return;
    }

    if (tab.isFont || tab.isBin) {
      copyBtn.style.display = 'none';
      gutter.textContent = '';
      codeScroll.innerHTML = `<div style="padding:48px;text-align:center;color:var(--text-muted);font-size:13px"><div style="font-size:40px;margin-bottom:12px">${tab.icon}</div>Binary file — no source preview.</div>`;
      clearMinimap();
      return;
    }

    copyBtn.style.display = 'inline-flex';
    const raw = await file.text();
    rawSourceCache[tab.path] = raw;
    const lines  = raw.split('\n');
    const lang   = LANG_MAP[tab.ext] || 'plaintext';
    const result = hljs.highlight(raw, {language:lang, ignoreIllegals:true});
    const highlighted = result.value;

    updatePanelMeta(file, lines.length, null);

    // Build gutter
    gutter.textContent = lines.map((_,i)=>String(i+1).padStart(4,' ')).join('\n');

    // Render code
    const pre  = document.createElement('pre');
    const code = document.createElement('code');
    code.className = `hljs language-${lang}`;
    code.innerHTML = highlighted;
    pre.appendChild(code);
    codeScroll.innerHTML = '';
    codeScroll.appendChild(pre);

    // Cache it
    tab.cache = { highlighted, lines:lines.length, gutter:gutter.textContent, raw };

    // Minimap
    renderMinimap(highlighted);

  } catch(err) {
    console.error(err);
    codeScroll.innerHTML = `<div style="padding:32px;color:#d16969;font-size:13px">Error reading file: ${err.message}</div>`;
  }
}

function applyCache(tab) {
  const c = tab.cache;
  const codeScroll = document.getElementById('code-scroll');
  const gutter = document.getElementById('line-gutter');
  const ext = tab.ext;
  const lang = LANG_MAP[ext] || 'plaintext';
  gutter.textContent = c.gutter;
  const pre = document.createElement('pre');
  const code = document.createElement('code');
  code.className = `hljs language-${lang}`;
  code.innerHTML = c.highlighted;
  pre.appendChild(code);
  codeScroll.innerHTML = '';
  codeScroll.appendChild(pre);
  renderMinimap(c.highlighted);
  document.getElementById('val-lines').textContent = c.lines;
}

function showEmptyState() {
  document.getElementById('code-scroll').innerHTML = `<div id="empty-state"><div class="es-icon">🗂</div><div class="es-title">Select a file</div><div class="es-sub">Click any file in the sidebar.</div></div>`;
  document.getElementById('line-gutter').textContent = '';
  clearMinimap();
}

// ════════════════════════════════════════════════════════
// MINIMAP
// ════════════════════════════════════════════════════════
function renderMinimap(highlighted) {
  const minimap     = document.getElementById('minimap');
  const minimapCode = minimap.querySelector('.minimap-code');
  minimapCode.innerHTML = highlighted;

  requestAnimationFrame(() => {
    const editorW = document.getElementById('code-scroll').clientWidth || 800;
    const scale   = (minimap.clientWidth - 2) / editorW;
    minimapCode.style.transform = `scale(${scale})`;
    minimapCode.style.width     = editorW + 'px';
    updateMinimapViewport();
  });
}

function updateMinimapViewport() {
  const cs        = document.getElementById('code-scroll');
  const minimap   = document.getElementById('minimap');
  const viewport  = minimap.querySelector('.minimap-viewport');
  const inner     = minimap.querySelector('.minimap-inner');
  if (!viewport || !cs.firstChild) return;

  const editorW   = cs.clientWidth || 800;
  const scale     = (minimap.clientWidth - 2) / editorW;
  const totalH    = cs.scrollHeight;
  const viewH     = cs.clientHeight;
  const scrollTop = cs.scrollTop;
  const mmH       = minimap.clientHeight;
  const scaledH   = totalH * scale;
  const ratio     = scrollTop / Math.max(totalH - viewH, 1);
  const vpH       = Math.max((viewH / totalH) * mmH, 16);
  const vpTop     = ratio * (mmH - vpH);
  viewport.style.height = vpH + 'px';
  viewport.style.top    = vpTop + 'px';

  // Scroll the minimap inner content
  if (scaledH > mmH) {
    const mmScrollTop = ratio * (scaledH - mmH);
    inner.style.transform = `translateY(${-mmScrollTop}px)`;
  } else {
    inner.style.transform = '';
  }
}

function clearMinimap() {
  const mc = document.querySelector('.minimap-code');
  if (mc) mc.innerHTML = '';
  const vp = document.querySelector('.minimap-viewport');
  if (vp) { vp.style.height='0'; vp.style.top='0'; }
}

// Sync gutter scroll with code scroll
document.getElementById('code-scroll').addEventListener('scroll', () => {
  const cs = document.getElementById('code-scroll');
  document.getElementById('line-gutter').scrollTop = cs.scrollTop;
  updateMinimapViewport();
});

// Minimap click to jump
document.getElementById('minimap').addEventListener('click', e => {
  const minimap = document.getElementById('minimap');
  const cs = document.getElementById('code-scroll');
  const ratio = e.offsetY / minimap.clientHeight;
  cs.scrollTop = ratio * cs.scrollHeight;
});

// ════════════════════════════════════════════════════════
// BREADCRUMB
// ════════════════════════════════════════════════════════
function renderBreadcrumb(filePath) {
  const bar = document.getElementById('breadcrumb');
  if (!filePath) { bar.innerHTML = ''; return; }
  const parts = filePath.split('/');
  let html = '';
  parts.forEach((p, i) => {
    const isLast = i === parts.length-1;
    if (i > 0) html += '<span class="crumb-sep">›</span>';
    html += `<span class="crumb${isLast?' last':''}" data-idx="${i}">${p}</span>`;
  });
  bar.innerHTML = html;
}

// ════════════════════════════════════════════════════════
// PANEL META
// ════════════════════════════════════════════════════════
function updatePanelMeta(file, lines, extra) {
  document.getElementById('val-lines').textContent = lines !== null ? lines : '—';
  document.getElementById('val-size').textContent  = formatSize(file.size);
  document.getElementById('val-modified').textContent = formatDate(file.lastModified);
}
function clearPanelMeta() {
  ['val-lines','val-size','val-modified'].forEach(id => document.getElementById(id).textContent = '—');
  document.getElementById('open-tab-btn').style.display = 'none';
  document.getElementById('copy-btn').style.display = 'none';
}

// ════════════════════════════════════════════════════════
// COPY SOURCE
// ════════════════════════════════════════════════════════
document.getElementById('copy-btn').addEventListener('click', async () => {
  const tab = tabs.find(t=>t.id===activeTabId);
  if (!tab) return;
  const raw = rawSourceCache[tab.path] || (tab.cache && tab.cache.raw);
  if (!raw) return;
  try {
    await navigator.clipboard.writeText(raw);
    const notice = document.getElementById('copy-success');
    notice.style.opacity = '1';
    setTimeout(() => notice.style.opacity = '0', 1600);
  } catch(e) { console.error(e); }
});

// ════════════════════════════════════════════════════════
// TREE HIGHLIGHT
// ════════════════════════════════════════════════════════
function updateTreeHighlight(path) {
  document.querySelectorAll('.tree-file-row').forEach(el => {
    el.classList.toggle('active', el.dataset.path === path);
  });
}

// ════════════════════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════════════════════
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim().toLowerCase();
  applySearch(searchQ);
});

function applySearch(q) {
  document.querySelectorAll('.tree-file-row, .tree-folder-row, .tree-children').forEach(el => el.style.display='');
  if (!q) return;
  document.querySelectorAll('.tree-file-row').forEach(el => {
    el.style.display = el.dataset.path.toLowerCase().includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.tree-folder-row').forEach(row => {
    const children = row.nextElementSibling;
    if (!children) return;
    const has = children.querySelector('.tree-file-row:not([style*="display: none"])');
    row.style.display = has ? '' : 'none';
    if (has) { children.classList.add('open'); row.querySelector('.tree-arrow').classList.add('open'); }
  });
}

// ════════════════════════════════════════════════════════
// COLLAPSE ALL
// ════════════════════════════════════════════════════════
document.getElementById('collapse-btn').addEventListener('click', () => {
  openFolders.clear();
  document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.tree-arrow').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.tree-folder-row span:nth-child(2)').forEach(el => el.textContent='📁');
});

// ════════════════════════════════════════════════════════
// AUTO REFRESH
// ════════════════════════════════════════════════════════
function startRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async () => {
    const prev = allFiles.length;
    await rebuildTree();
    if (allFiles.length !== prev) {
      // Invalidate caches for changed files
      tabs.forEach(t => { t.cache = null; });
    }
  }, REFRESH_MS);
}

// ════════════════════════════════════════════════════════
// DRAG RESIZE SIDEBAR
// ════════════════════════════════════════════════════════
const divider = document.getElementById('divider');
const sidebar = document.getElementById('sidebar');
let dragging = false;

divider.addEventListener('mousedown', e => {
  dragging = true;
  divider.classList.add('drag');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const rect = document.getElementById('main').getBoundingClientRect();
  const w = Math.max(150, Math.min(e.clientX - rect.left, rect.width * 0.7));
  sidebar.style.width = w + 'px';
  requestAnimationFrame(updateMinimapViewport);
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  divider.classList.remove('drag');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// ════════════════════════════════════════════════════════
// KEYBOARD
// ════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key === 'p') {
    e.preventDefault();
    document.getElementById('search').focus();
    document.getElementById('search').select();
  }
  if ((e.ctrlKey||e.metaKey) && e.key === 'w') {
    e.preventDefault();
    if (activeTabId) closeTab(activeTabId);
  }
  // Ctrl+Tab: cycle tabs
  if (e.ctrlKey && e.key === 'Tab') {
    e.preventDefault();
    if (tabs.length < 2) return;
    const idx = tabs.findIndex(t=>t.id===activeTabId);
    const next = tabs[(idx+1) % tabs.length];
    activateTab(next.id);
  }
});

// Middle-click to close tab
document.getElementById('tab-bar').addEventListener('mousedown', e => {
  if (e.button !== 1) return;
  const tab = e.target.closest('.tab');
  if (tab) { e.preventDefault(); closeTab(Number(tab.dataset.id)); }
});
</script>
